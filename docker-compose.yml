services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brandlens
      POSTGRES_USER: brandlens
      POSTGRES_PASSWORD: brandlens
    ports: ["5432:5432"]
    volumes: ["brandlens-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandlens"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/brandlens
      DB_USERNAME: brandlens
      DB_PASSWORD: brandlens
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    depends_on:
      db: { condition: service_healthy }
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  brandlens-data:
