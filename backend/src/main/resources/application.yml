server:
  port: 8080
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/brandlens}
    username: ${DB_USERNAME:brandlens}
    password: ${DB_PASSWORD:brandlens}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
brandlens:
  ai-key: ${AI_API_KEY:}
  ai-base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  ai-model: ${AI_MODEL:gpt-4o-mini}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
